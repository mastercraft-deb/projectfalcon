<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Razão e Proporção: Regra de Equivalência</text>

  <!-- Lado Esquerdo: Receita Base -->
  <g transform="translate(60, 50)">
    <rect width="250" height="125" rx="10" fill="rgba(255, 122, 92, 0.12)" stroke="#FF7A5C" stroke-width="1.5"/>
    <text x="125" y="24" fill="#FFA590" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Receita Original (1 Jarra)</text>

    <!-- 2 Copos de Suco e 3 Copos de Água -->
    <g transform="translate(30, 42)">
      <!-- Suco -->
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#FF5A5F"/>
      <text x="40" y="16" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">2 Suco</text>

      <text x="95" y="17" fill="#FFF" font-size="16" font-weight="bold">/</text>

      <!-- Água -->
      <rect x="110" y="0" width="80" height="24" rx="4" fill="#00B4D8"/>
      <text x="150" y="16" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">3 Água</text>
    </g>

    <text x="125" y="98" fill="#FFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Razão: 2 / 3</text>
  </g>

  <!-- Seta central de proporção ×2 -->
  <g transform="translate(330, 95)">
    <circle cx="20" cy="15" r="18" fill="#FFD166"/>
    <text x="20" y="20" fill="#17062e" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">× 2</text>
    <path d="M -10 15 L 2 15" stroke="#FFD166" stroke-width="2"/>
    <path d="M 38 15 L 50 15" stroke="#FFD166" stroke-width="2"/>
  </g>

  <!-- Lado Direito: Proporção Dobrada -->
  <g transform="translate(390, 50)">
    <rect width="250" height="125" rx="10" fill="rgba(6, 214, 160, 0.12)" stroke="#06D6A0" stroke-width="1.5"/>
    <text x="125" y="24" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dobro da Receita (2 Jarras)</text>

    <!-- 4 Copos de Suco e 6 Copos de Água -->
    <g transform="translate(30, 42)">
      <!-- Suco -->
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#FF5A5F"/>
      <text x="40" y="16" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">4 Suco</text>

      <text x="95" y="17" fill="#FFF" font-size="16" font-weight="bold">/</text>

      <!-- Água -->
      <rect x="110" y="0" width="80" height="24" rx="4" fill="#00B4D8"/>
      <text x="150" y="16" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">6 Água</text>
    </g>

    <text x="125" y="98" fill="#FFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Razão: 4 / 6 = 2 / 3</text>
  </g>

  <!-- Dica de ouro -->
  <text x="350" y="205" fill="#FFD166" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✨ Regra dos produtos cruzados: 2 × 6 = 3 × 4 = 12 (Sempre bate certo!)</text>
</svg>
