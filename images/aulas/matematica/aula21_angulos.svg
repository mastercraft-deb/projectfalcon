<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Tipos de Ângulos: Uma Visão Prática</text>

  <!-- Ângulo Agudo (< 90°) -->
  <g transform="translate(40, 55)">
    <rect width="135" height="135" rx="8" fill="rgba(255,255,255,0.05)" stroke="#EF476F" stroke-width="1.2"/>
    <text x="67" y="24" fill="#FF8589" font-size="12" font-weight="bold" text-anchor="middle">AGUDO</text>
    <text x="67" y="40" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="middle">Menor que 90°</text>

    <!-- Desenho do ângulo -->
    <path d="M 25 110 L 105 110" stroke="#FFF" stroke-width="2.5"/>
    <path d="M 25 110 L 85 55" stroke="#EF476F" stroke-width="2.5"/>
    <!-- Arco -->
    <path d="M 50 110 A 25 25 0 0 0 45 92" fill="none" stroke="#FFD166" stroke-width="2"/>
    <circle cx="25" cy="110" r="3.5" fill="#FFF"/>
    <text x="68" y="100" fill="#FFD166" font-size="10" font-weight="bold">45°</text>
  </g>

  <!-- Ângulo Reto (= 90°) -->
  <g transform="translate(195, 55)">
    <rect width="135" height="135" rx="8" fill="rgba(255,255,255,0.05)" stroke="#06D6A0" stroke-width="1.2"/>
    <text x="67" y="24" fill="#5CE1E6" font-size="12" font-weight="bold" text-anchor="middle">RETO</text>
    <text x="67" y="40" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="middle">Exatamente 90°</text>

    <!-- Desenho em L -->
    <path d="M 25 110 L 105 110" stroke="#FFF" stroke-width="2.5"/>
    <path d="M 25 110 L 25 45" stroke="#06D6A0" stroke-width="2.5"/>
    <!-- Quadrado de 90° com ponto -->
    <rect x="25" y="94" width="16" height="16" fill="none" stroke="#FFD166" stroke-width="1.8"/>
    <circle cx="33" cy="102" r="1.5" fill="#FFD166"/>
    <circle cx="25" cy="110" r="3.5" fill="#FFF"/>
    <text x="68" y="90" fill="#FFD166" font-size="10" font-weight="bold">90°</text>
  </g>

  <!-- Ângulo Obtuso (> 90° e < 180°) -->
  <g transform="translate(350, 55)">
    <rect width="150" height="135" rx="8" fill="rgba(255,255,255,0.05)" stroke="#FFD166" stroke-width="1.2"/>
    <text x="75" y="24" fill="#FFD166" font-size="12" font-weight="bold" text-anchor="middle">OBTUSO</text>
    <text x="75" y="40" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="middle">Entre 90° e 180°</text>

    <!-- Desenho aberto -->
    <path d="M 60 110 L 135 110" stroke="#FFF" stroke-width="2.5"/>
    <path d="M 60 110 L 15 65" stroke="#FFD166" stroke-width="2.5"/>
    <!-- Arco -->
    <path d="M 85 110 A 25 25 0 0 0 45 85" fill="none" stroke="#EF476F" stroke-width="2"/>
    <circle cx="60" cy="110" r="3.5" fill="#FFF"/>
    <text x="65" y="78" fill="#EF476F" font-size="10" font-weight="bold">135°</text>
  </g>

  <!-- Ângulo Raso (= 180°) -->
  <g transform="translate(520, 55)">
    <rect width="140" height="135" rx="8" fill="rgba(255,255,255,0.05)" stroke="#A98BFF" stroke-width="1.2"/>
    <text x="70" y="24" fill="#C4B0FF" font-size="12" font-weight="bold" text-anchor="middle">RASO</text>
    <text x="70" y="40" fill="rgba(255,255,255,0.7)" font-size="10" text-anchor="middle">Exatamente 180°</text>

    <!-- Desenho linha contínua -->
    <path d="M 15 105 L 125 105" stroke="#A98BFF" stroke-width="2.5"/>
    <!-- Meio círculo -->
    <path d="M 45 105 A 25 25 0 0 1 95 105" fill="none" stroke="#FFD166" stroke-width="2"/>
    <circle cx="70" cy="105" r="3.5" fill="#FFF"/>
    <text x="70" y="75" fill="#FFD166" font-size="10" font-weight="bold">180°</text>
  </g>

  <!-- Dica de ouro -->
  <text x="350" y="215" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle">
    📐 Uma volta completa tem 360°. O ângulo reto (90°) é o canto perfeito da tela, da parede e do livro!
  </text>
</svg>
