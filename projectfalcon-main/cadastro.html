<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../image/miniatura.png" type="image/x-icon">
    <title>Cadastro - Galea</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="body"><br>
    <div class="formulariocad"> <br>
            <img src="images/logos/logo.png" alt="logo" height="110" width="115" id="logogalea"><h1 id="galealogin">Cadastro</h1>
            <form action="login.html" method="post">
                <label for="usuario">Nome: </label>
                <input type="text" name="nome" placeholder="Digite seu nome" class="input">
                <br>
                <label for="lastname">Sobrenome: </label>
                <input type="text" name="sobrenome" placeholder="Digite seu sobrenome" class="input">
                <br>
                <label for="e-mail">E-mail: </label>
                <input type="text" name="email" placeholder="Digite seu email" class="input">
                <br>
                <label for="lastname">Senha: </label>
                <input type="password" name="sobrenome" placeholder="Digite seu sobrenome" class="input">
                <br>
                <label for="lastname">Você é: </label>
                <select name="tipo" id="tipo">
                    <option value="aluno">Aluno</option>
                    <option value="professor">Professor</option>
                </select>
                <div class="entrar">
                    <div class="login-social">
                        <button id="google" class="botao-login"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQU6O1zR7fL_qZd3e8NSurCdEhdI_HPBa_eSvrPkhjDEQ&s=10" alt="" width="17px" height="17px"> Google</button><br>
                        <button id="Facebook" class="botao-login"><img src="https://gdm-catalog-fmapi-prod.imgix.net/ProductLogo/4f532b23-81f2-49b9-b087-ee2977addcf0.png?w=80&h=80&fit=max&dpr=3&auto=format&q=50" alt="" width="17px" height="17px">Cléber</button>
                    </div>
                    <img src="images/others/ou.png" height="60px" width="30px" id="ou">
                    <input type="submit" value="Próximo"><br>
                    <a href="login.html"><p id="cadastro">Possui uma conta? Clique aqui para logar-se</p></a>
                </div><!--Fim div class entrar-->
            </form>
        </div>
    </div>
</body>
</html>
