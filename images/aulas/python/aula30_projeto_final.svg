<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Projeto Final: Conectando Todos os Conceitos de Python</text>

  <!-- Pilares do Projeto Final -->
  <g transform="translate(50, 50)">
    <!-- Bloco 1: Dados -->
    <rect x="0" y="0" width="135" height="115" rx="8" fill="rgba(255,255,255,0.05)" stroke="#118AB2" stroke-width="1.5"/>
    <text x="67" y="24" fill="#5CE1E6" font-size="12" font-weight="bold" text-anchor="middle">1. Dados</text>
    <text x="67" y="52" fill="#FFF" font-size="11" text-anchor="middle">Listas &amp; Dicts</text>
    <text x="67" y="74" fill="#FFF" font-size="11" text-anchor="middle">Arquivos JSON</text>
    <text x="67" y="96" fill="#FFD166" font-size="10" text-anchor="middle">Persistência</text>

    <!-- Bloco 2: Lógica -->
    <rect x="155" y="0" width="135" height="115" rx="8" fill="rgba(255,255,255,0.05)" stroke="#FFD166" stroke-width="1.5"/>
    <text x="222" y="24" fill="#FFD166" font-size="12" font-weight="bold" text-anchor="middle">2. Lógica</text>
    <text x="222" y="52" fill="#FFF" font-size="11" text-anchor="middle">Funções Modulares</text>
    <text x="222" y="74" fill="#FFF" font-size="11" text-anchor="middle">Tratamento Erros</text>
    <text x="222" y="96" fill="#5CE1E6" font-size="10" text-anchor="middle">try / except</text>

    <!-- Bloco 3: Classes -->
    <rect x="310" y="0" width="135" height="115" rx="8" fill="rgba(255,255,255,0.05)" stroke="#06D6A0" stroke-width="1.5"/>
    <text x="377" y="24" fill="#06D6A0" font-size="12" font-weight="bold" text-anchor="middle">3. Objetos</text>
    <text x="377" y="52" fill="#FFF" font-size="11" text-anchor="middle">Classes &amp; Métodos</text>
    <text x="377" y="74" fill="#FFF" font-size="11" text-anchor="middle">Herança limpa</text>
    <text x="377" y="96" fill="#FFD166" font-size="10" text-anchor="middle">Boas Práticas</text>

    <!-- Bloco 4: Usuário -->
    <rect x="465" y="0" width="135" height="115" rx="8" fill="rgba(239, 71, 111, 0.15)" stroke="#EF476F" stroke-width="1.5"/>
    <text x="532" y="24" fill="#FF8589" font-size="12" font-weight="bold" text-anchor="middle">4. Interação</text>
    <text x="532" y="52" fill="#FFF" font-size="11" text-anchor="middle">Menu no Terminal</text>
    <text x="532" y="74" fill="#FFF" font-size="11" text-anchor="middle">Entrada &amp; Validação</text>
    <text x="532" y="96" fill="#06D6A0" font-size="10" font-weight="bold" text-anchor="middle">Sistema Completo</text>
  </g>

  <text x="350" y="205" fill="#FFD166" font-size="12" font-weight="bold" text-anchor="middle">
    🏆 Parabéns! Você dominou a base completa para criar automações, APIs e ciência de dados com Python!
  </text>
</svg>
