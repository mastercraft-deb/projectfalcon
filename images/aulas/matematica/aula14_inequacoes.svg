<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Inequações na Reta: Bolinha Aberta vs. Fechada</text>

  <!-- Caso 1: x > 2 (Maior estrito: Bolinha Aberta) -->
  <g transform="translate(60, 55)">
    <text x="0" y="20" fill="#EF476F" font-size="16" font-weight="800">x &gt; 2</text>
    <text x="60" y="20" fill="rgba(255,255,255,0.7)" font-size="12">"Maior que 2" (o 2 NÃO entra no resultado!)</text>

    <!-- Reta -->
    <path d="M 0 50 L 580 50" stroke="#443366" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Faixa destacada à direita do 2 -->
    <path d="M 230 50 L 575 50" stroke="#EF476F" stroke-width="6" stroke-linecap="round"/>
    <polygon points="580,50 568,44 568,56" fill="#EF476F"/>

    <!-- Ponto 0 -->
    <line x1="110" y1="44" x2="110" y2="56" stroke="#AAA" stroke-width="2"/>
    <text x="110" y="74" fill="#AAA" font-size="12" text-anchor="middle">0</text>

    <!-- Ponto 2 com bolinha aberta -->
    <circle cx="230" cy="50" r="7" fill="#17062e" stroke="#EF476F" stroke-width="3"/>
    <text x="230" y="76" fill="#EF476F" font-size="13" font-weight="bold" text-anchor="middle">2 (aberta)</text>
  </g>

  <!-- Caso 2: x ≤ 4 (Menor ou igual: Bolinha Fechada) -->
  <g transform="translate(60, 135)">
    <text x="0" y="20" fill="#06D6A0" font-size="16" font-weight="800">x ≤ 4</text>
    <text x="60" y="20" fill="rgba(255,255,255,0.7)" font-size="12">"Menor ou igual a 4" (o 4 ESTÁ incluído!)</text>

    <!-- Reta -->
    <path d="M 0 50 L 580 50" stroke="#443366" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Faixa destacada à esquerda do 4 -->
    <path d="M 5 50 L 350 50" stroke="#06D6A0" stroke-width="6" stroke-linecap="round"/>
    <polygon points="0,50 12,44 12,56" fill="#06D6A0"/>

    <!-- Ponto 0 -->
    <line x1="110" y1="44" x2="110" y2="56" stroke="#AAA" stroke-width="2"/>
    <text x="110" y="74" fill="#AAA" font-size="12" text-anchor="middle">0</text>

    <!-- Ponto 4 com bolinha fechada -->
    <circle cx="350" cy="50" r="7" fill="#06D6A0" stroke="#06D6A0" stroke-width="2"/>
    <text x="350" y="76" fill="#06D6A0" font-size="13" font-weight="bold" text-anchor="middle">4 (fechada)</text>
  </g>

  <!-- Alerta de ouro -->
  <text x="350" y="228" fill="#FFD166" font-size="11" font-weight="600" text-anchor="middle">
    ⚠️ Atenção ao multiplicar ou dividir por número negativo: o sinal da desigualdade INVERTE! (&gt; vira &lt;)
  </text>
</svg>
