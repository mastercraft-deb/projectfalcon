<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Operadores Aritméticos em Python</text>

  <!-- Grade dos operadores -->
  <g transform="translate(40, 50)">
    <!-- Soma e Subtração -->
    <rect x="0" y="0" width="140" height="70" rx="8" fill="rgba(255,255,255,0.05)" stroke="#06D6A0" stroke-width="1.2"/>
    <text x="70" y="24" fill="#5CE1E6" font-size="12" font-weight="bold" text-anchor="middle">Soma e Subtração</text>
    <text x="70" y="46" fill="#FFF" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">10 + 5  ➔ 15</text>
    <text x="70" y="62" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="12" text-anchor="middle">10 - 5  ➔ 5</text>

    <!-- Multiplicação e Divisão -->
    <rect x="160" y="0" width="140" height="70" rx="8" fill="rgba(255,255,255,0.05)" stroke="#FFD166" stroke-width="1.2"/>
    <text x="230" y="24" fill="#FFD166" font-size="12" font-weight="bold" text-anchor="middle">Mult. e Divisão</text>
    <text x="230" y="46" fill="#FFF" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">4 * 3   ➔ 12</text>
    <text x="230" y="62" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="12" text-anchor="middle">7 / 2   ➔ 3.5</text>

    <!-- Divisão Inteira // -->
    <rect x="320" y="0" width="140" height="70" rx="8" fill="rgba(255,255,255,0.05)" stroke="#EF476F" stroke-width="1.2"/>
    <text x="390" y="24" fill="#FF8589" font-size="12" font-weight="bold" text-anchor="middle">Divisão Inteira (//)</text>
    <text x="390" y="46" fill="#FFF" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">7 // 2  ➔ 3</text>
    <text x="390" y="62" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">(Descarta o decimal)</text>

    <!-- Módulo % (Resto) -->
    <rect x="480" y="0" width="140" height="70" rx="8" fill="rgba(255,255,255,0.05)" stroke="#A98BFF" stroke-width="1.2"/>
    <text x="550" y="24" fill="#C4B0FF" font-size="12" font-weight="bold" text-anchor="middle">Módulo % (Resto)</text>
    <text x="550" y="46" fill="#FFF" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">7 % 2   ➔ 1</text>
    <text x="550" y="62" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">(Resto da divisão!)</text>

    <!-- Potência ** (Linha de Baixo) -->
    <rect x="160" y="85" width="300" height="55" rx="8" fill="rgba(46, 196, 182, 0.15)" stroke="#2EC4B6" stroke-width="1.5"/>
    <text x="310" y="108" fill="#5CE1E6" font-size="13" font-weight="bold" text-anchor="middle">Potência: ** (Não use ^ em Python!)</text>
    <text x="310" y="130" fill="#FFF" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">2 ** 3  ➔ 8  (2 × 2 × 2)</text>
  </g>

  <!-- Dica de ouro -->
  <text x="350" y="218" fill="#FFD166" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    💡 Truque de ouro: x % 2 == 0 é o jeito universal de saber se um número é PAR em programação!
  </text>
</svg>
