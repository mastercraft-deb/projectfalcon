<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Quadrado da Soma: (a + b)² = a² + 2ab + b²</text>

  <!-- Representação Geométrica (Quadrado subdividido) -->
  <g transform="translate(100, 50)">
    <!-- Quadrado a² -->
    <rect x="0" y="0" width="100" height="100" fill="#EF476F" rx="4"/>
    <text x="50" y="55" fill="#FFF" font-size="20" font-weight="900" text-anchor="middle">a²</text>
    <text x="50" y="-8" fill="#EF476F" font-size="13" font-weight="bold" text-anchor="middle">a</text>
    <text x="-12" y="55" fill="#EF476F" font-size="13" font-weight="bold" text-anchor="middle">a</text>

    <!-- Retângulo ab (Direita) -->
    <rect x="106" y="0" width="50" height="100" fill="#FFD166" rx="4"/>
    <text x="131" y="55" fill="#17062e" font-size="14" font-weight="bold" text-anchor="middle">ab</text>
    <text x="131" y="-8" fill="#FFD166" font-size="13" font-weight="bold" text-anchor="middle">b</text>

    <!-- Retângulo ab (Abaixo) -->
    <rect x="0" y="106" width="100" height="50" fill="#FFD166" rx="4"/>
    <text x="50" y="136" fill="#17062e" font-size="14" font-weight="bold" text-anchor="middle">ab</text>
    <text x="-12" y="136" fill="#FFD166" font-size="13" font-weight="bold" text-anchor="middle">b</text>

    <!-- Quadrado b² (Canto inferior direito) -->
    <rect x="106" y="106" width="50" height="50" fill="#06D6A0" rx="4"/>
    <text x="131" y="136" fill="#17062e" font-size="15" font-weight="900" text-anchor="middle">b²</text>
  </g>

  <!-- Fórmula e explicação ao lado -->
  <g transform="translate(320, 60)">
    <rect width="320" height="145" rx="10" fill="rgba(255,255,255,0.05)" stroke="#A98BFF" stroke-width="1.5"/>
    <text x="160" y="32" fill="#FFFFFF" font-size="16" font-weight="800" text-anchor="middle">
      Área Total = (a + b) × (a + b)
    </text>
    <line x1="20" y1="46" x2="300" y2="46" stroke="rgba(255,255,255,0.15)"/>
    
    <text x="30" y="74" fill="#EF476F" font-size="13" font-weight="bold">• 1º termo ao quadrado: a²</text>
    <text x="30" y="98" fill="#FFD166" font-size="13" font-weight="bold">• 2 vezes o 1º pelo 2º: + 2ab</text>
    <text x="30" y="122" fill="#06D6A0" font-size="13" font-weight="bold">• 2º termo ao quadrado: + b²</text>
  </g>

  <text x="350" y="235" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    💡 Nunca confunda: (a + b)² NÃO é igual a a² + b²! Faltam os dois retângulos 'ab'.
  </text>
</svg>
