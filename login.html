<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Galea</title>
    <link rel="icon" href="images/logos/logo.png" type="image/png">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="body"><br>
    <div class="formulario"> <br>
            <img src="images/logos/logo.png" alt="logo" height="110" width="115" id="logogalea"><h1 id="galealogin">Login</h1>
            <form action="home.html" method="post">
                <label for="usuario">Usuário: </label>
                <input type="text" name="nome" placeholder="Digite seu nome" class="input">
                <br>
                <label for="lastname">Senha: </label>
                <input type="password" name="senha" placeholder="Digite sua senha" class="input">
                
                <div class="entrar">
                    <div class="login-social">
                        <button id="google" class="botao-login"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQU6O1zR7fL_qZd3e8NSurCdEhdI_HPBa_eSvrPkhjDEQ&s=10" alt="" width="17px" height="17px"> Google</button><br>
                        <button id="Facebook" class="botao-login"><img src="https://gdm-catalog-fmapi-prod.imgix.net/ProductLogo/4f532b23-81f2-49b9-b087-ee2977addcf0.png?w=80&h=80&fit=max&dpr=3&auto=format&q=50" alt="" width="17px" height="17px">Cléber</button>
                    </div>
                    <img src="images/others/ou.png" height="60px" width="30px" id="ou">
                    <input type="submit" value="Entrar"><br>
                    <a href="cadastro.html"><p id="cadastro">Não possui uma conta? Se não,clique aqui para cadastrar-se</p></a>
                </div><!--Fim div class entrar-->
            </form>
        </div>
    </div>
    </body>
    </html>
</body>
