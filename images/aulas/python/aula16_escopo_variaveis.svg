<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Escopo de Variáveis: Global vs. Local</text>

  <!-- Caixa Global -->
  <g transform="translate(60, 50)">
    <rect width="580" height="135" rx="12" fill="rgba(17, 138, 178, 0.15)" stroke="#118AB2" stroke-width="2"/>
    <text x="25" y="28" fill="#5CE1E6" font-size="13" font-weight="bold">ESCOPO GLOBAL (O arquivo inteiro enxerga)</text>
    <text x="25" y="52" fill="#FFF" font-family="monospace" font-size="13">xp_padrao = 10</text>

    <!-- Caixa Local (Dentro da Função) -->
    <g transform="translate(180, 40)">
      <rect width="370" height="75" rx="8" fill="rgba(239, 71, 111, 0.18)" stroke="#EF476F" stroke-width="1.5"/>
      <text x="20" y="22" fill="#FF8589" font-size="12" font-weight="bold">ESCOPO LOCAL (Dentro da função)</text>
      <text x="20" y="44" fill="#FFF" font-family="monospace" font-size="12">def calcular_bonus():</text>
      <text x="40" y="62" fill="#FFD166" font-family="monospace" font-size="12">bonus = 50  # nasce e morre aqui dentro!</text>
    </g>
  </g>

  <text x="350" y="218" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    ⚠️ Se você tentar dar <tspan fill="#FF8589">print(bonus)</tspan> fora da função, o Python dá erro: <tspan fill="#FFD166">NameError</tspan>!
  </text>
</svg>
