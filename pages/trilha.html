<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha do curso - Galea</title>
    <link rel="icon" href="../images/logos/logo.png" type="image/png">

    <!-- Preferências (Configurações) valem para o site todo -->
    <script src="../script/preferencias.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/trilha.css">

    <!-- Ordem: catálogo/Meus cursos, dados das trilhas, e por último o script desta página -->
    <script src="../script/cursos.js" defer></script>
    <script src="../script/trilhas.js" defer></script>
    <script src="../script/trilha.js" defer></script>
</head>
<body class="body">
    <!-- Qual curso abrir vem do endereço: trilha.html?curso=python (sem isso, abre Física) -->
    <div class="trilha-layout" id="trilha-layout">

        <main class="trilha-pagina">

            <!-- Faixa fixa no topo: mostra onde você está, mesmo rolando o mapa -->
            <header class="trilha-topo">
                <!-- target="_top": a página do curso ocupa a janela inteira, fora do iframe -->
                <a class="trilha-voltar" id="trilha-voltar" href="courses/fisica.html" target="_top">
                    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                    Sobre o curso
                </a>

                <div class="trilha-titulo">
                    <h1 id="trilha-curso">Física quântica – 2026</h1>
                    <p><span id="trilha-concluidos">0</span> de <span id="trilha-total">0</span> aulas concluídas</p>
                </div>

                <!-- A largura do preenchimento vem da variável --progresso -->
                <div class="trilha-barra" id="trilha-barra" role="progressbar" aria-label="Progresso no curso"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--progresso: 0%;">
                    <span class="trilha-barra-preenchimento"></span>
                </div>
            </header>

            <!--
                O mapa. Cada <li> é uma aula e é criado pelo script/trilha.js a partir de
                script/trilhas.js (uma aula = um círculo). Cada <li> tem UM destes estados (classe):
                  modulo-concluido  -> já terminada   (verde, ícone de check)
                  modulo-atual      -> a próxima aula (cor do curso, com o cartão de título)
                  modulo-bloqueado  -> ainda não liberada (cor escura do curso, cadeado)
                A posição em zigue-zague e as linhas de ligação são feitas só pelo CSS
                (por ordem do <li>), então basta incluir ou remover itens da lista.
                Quantas aulas já estão concluídas vem do progresso do curso em "Meus cursos".
            -->
            <ol class="trilha" id="trilha" aria-label="Aulas do curso"></ol>
        </main>

        <!-- Lado direito: entrada direta para o chat deste curso na Comunidade -->
        <aside class="trilha-chat" aria-labelledby="trilha-chat-titulo">
            <span class="trilha-chat-icone" aria-hidden="true">
                <span class="material-symbols-outlined">forum</span>
            </span>
            <div class="trilha-chat-corpo">
                <h2 id="trilha-chat-titulo">Chat do curso</h2>
                <p id="trilha-chat-texto"></p>
                <button type="button" class="trilha-chat-botao" id="trilha-chat-botao"></button>
            </div>
        </aside>
    </div>

    <p class="sr-only" id="trilha-aviso" aria-live="polite"></p>
</body>
</html>
