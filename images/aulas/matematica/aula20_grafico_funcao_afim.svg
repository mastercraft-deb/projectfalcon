<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Gráfico da Função Afim: y = ax + b</text>

  <!-- Plano Cartesiano -->
  <g transform="translate(100, 45)">
    <!-- Grade sutil -->
    <path d="M 0 50 L 220 50 M 0 100 L 220 100 M 0 150 L 220 150" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M 50 0 L 50 200 M 100 0 L 100 200 M 150 0 L 150 200" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Eixo X -->
    <line x1="10" y1="150" x2="220" y2="150" stroke="#FFF" stroke-width="2"/>
    <polygon points="225,150 215,145 215,155" fill="#FFF"/>
    <text x="220" y="170" fill="#FFF" font-size="12" font-weight="bold">x</text>

    <!-- Eixo Y -->
    <line x1="60" y1="190" x2="60" y2="15" stroke="#FFF" stroke-width="2"/>
    <polygon points="60,10 55,20 65,20" fill="#FFF"/>
    <text x="45" y="20" fill="#FFF" font-size="12" font-weight="bold">y</text>

    <!-- Reta y = 0.8x + 20 (Crescente) -->
    <line x1="20" y1="140" x2="190" y2="35" stroke="#00B4D8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Ponto onde corta o eixo Y (Coeficiente Linear 'b') -->
    <circle cx="60" cy="112" r="6" fill="#FFD166" stroke="#17062e" stroke-width="1.5"/>
    <text x="75" y="117" fill="#FFD166" font-size="12" font-weight="900">b (onde corta o Y)</text>

    <!-- Raiz da função (onde corta o X) -->
    <circle cx="150" cy="150" r="5" fill="#EF476F"/>
    <text x="150" y="170" fill="#FF8589" font-size="11" font-weight="bold" text-anchor="middle">raiz (y=0)</text>
  </g>

  <!-- Painel explicativo ao lado -->
  <g transform="translate(370, 50)">
    <rect width="280" height="175" rx="10" fill="rgba(255,255,255,0.05)" stroke="#00B4D8" stroke-width="1.5"/>
    
    <text x="140" y="28" fill="#5CE1E6" font-size="15" font-weight="800" text-anchor="middle">Anatomia da Reta</text>
    
    <!-- a = Coeficiente Angular -->
    <rect x="15" y="42" width="250" height="52" rx="6" fill="rgba(0, 180, 216, 0.15)"/>
    <text x="25" y="62" fill="#5CE1E6" font-size="13" font-weight="bold">'a' = Coeficiente Angular</text>
    <text x="25" y="82" fill="#FFF" font-size="11">Inclinação da reta: a &gt; 0 sobe ↗, a &lt; 0 desce ↘</text>

    <!-- b = Coeficiente Linear -->
    <rect x="15" y="104" width="250" height="52" rx="6" fill="rgba(255, 209, 102, 0.15)"/>
    <text x="25" y="124" fill="#FFD166" font-size="13" font-weight="bold">'b' = Coeficiente Linear</text>
    <text x="25" y="144" fill="#FFF" font-size="11">Ponto de partida quando x = 0 (corta o eixo Y)</text>
  </g>

  <text x="350" y="245" fill="rgba(255,255,255,0.7)" font-size="11" text-anchor="middle">
    Exemplo da vida real: Corrida de táxi = R$ 5,00 fixos (b) + R$ 2,50 por km rodado (a·x).
  </text>
</svg>
