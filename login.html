<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Galea</title>
    <link rel="icon" href="images/logos/logo.png" type="image/png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do projeto -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <!-- Estilo base do projeto (fontes Romanica e Dalek e paleta de cores) -->
    <link rel="stylesheet" href="style/style.css">

    <style>
        /* CSS fornecido pelo template */
        .bg-image-vertical {
            position: relative;
            overflow: hidden;
            background-repeat: no-repeat;
            background-position: right center;
            background-size: auto 100%;
        }

        @media (min-width: 1025px) {
            .h-custom-2 {
                height: 100%;
            }
        }

        /* Configurações da página de login */
        body.login-page {
            background-color: #ffffff;
            font-family: var(--romanica), sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Sessão de login branca: textos e fontes perfeitamente legíveis */
        .sessao-login-branca {
            background-color: #ffffff;
            min-height: 100vh;
            color: #1e003f;
        }

        .sessao-login-branca * {
            font-family: var(--romanica), sans-serif;
            color: #1e003f;
        }

        .login-logo-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .login-logo-link img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }

        .login-logo-link .login-logo-nome {
            font-family: var(--darek), sans-serif;
            font-size: 2.2rem;
            color: var(--cor1);
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
        }

        .login-titulo {
            font-family: var(--darek), sans-serif;
            font-size: 2.1rem;
            color: #1e003f;
            letter-spacing: 1px;
        }

        .sessao-login-branca .form-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #333333;
            margin-bottom: 0.4rem;
        }

        .sessao-login-branca .form-control {
            border: 1.5px solid #d0d4dc;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: #1e003f !important;
            background-color: #fbfbfd;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .sessao-login-branca .form-control:focus {
            border-color: var(--cor2);
            box-shadow: 0 0 0 3px rgba(118, 120, 237, 0.25);
            background-color: #ffffff;
            outline: none;
        }

        .campo-senha-wrap {
            position: relative;
        }

        .campo-senha-wrap .form-control {
            padding-right: 44px;
        }

        .btn-toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .btn-toggle-senha span {
            color: #666666 !important;
            font-size: 20px;
        }

        .btn-login-destaque {
            background-color: var(--cor1);
            border-color: var(--cor1);
            color: #ffffff !important;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 8px;
            padding: 0.75rem;
            transition: all 0.25s ease;
        }

        .btn-login-destaque:hover {
            background-color: var(--cor2);
            border-color: var(--cor2);
            color: #ffffff !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(61, 52, 139, 0.35);
        }

        .sessao-login-branca a {
            text-decoration: none;
        }

        .sessao-login-branca a.link-info {
            color: var(--cor2) !important;
            font-weight: bold;
        }

        .sessao-login-branca a.link-info:hover {
            color: var(--cor4) !important;
            text-decoration: underline;
        }

        .sessao-login-branca .text-muted {
            color: #6c757d !important;
        }

        .sessao-login-branca .text-muted:hover {
            color: var(--cor1) !important;
            text-decoration: underline;
        }

        .login-erro {
            color: #d32f2f !important;
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 1.25rem;
            margin-top: 0.25rem;
            margin-bottom: 0.5rem;
        }

        /* Imagem do céu estrelado à direita */
        .sessao-imagem-estrelas {
            position: relative;
            background-color: #1e003f;
            overflow: hidden;
        }

        .sessao-imagem-estrelas img {
            object-fit: cover;
            object-position: left;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="login-page">

<section class="vh-100">
  <div class="container-fluid">
    <div class="row">
      <!-- Sessão de Login (Fundo Branco, Logo Galea e Fontes do Projeto) -->
      <div class="col-sm-6 text-black sessao-login-branca d-flex flex-column justify-content-between p-4 p-md-5">

        <div class="px-3 px-xl-4 pt-2">
          <a href="index.html" class="login-logo-link">
            <img src="images/logos/logo.png" alt="Logotipo Galea">
            <span class="login-logo-nome">Galea</span>
          </a>
        </div>

        <div class="d-flex align-items-center h-custom-2 px-3 px-xl-4 my-auto py-4">

          <form style="width: 100%; max-width: 23rem;" id="form-login" novalidate>

            <h3 class="fw-normal mb-3 pb-3 login-titulo" style="letter-spacing: 1px;">Log in</h3>

            <div data-mdb-input-init class="form-outline mb-4">
              <label class="form-label" for="login-usuario">E-mail ou Usuário</label>
              <input type="text" id="login-usuario" name="usuario" class="form-control form-control-lg" placeholder="Digite seu e-mail ou usuário" required autocomplete="username" />
            </div>

            <div data-mdb-input-init class="form-outline mb-2">
              <label class="form-label" for="login-senha">Senha</label>
              <div class="campo-senha-wrap">
                <input type="password" id="login-senha" name="senha" class="form-control form-control-lg" placeholder="Digite sua senha" required autocomplete="current-password" />
                <button type="button" class="btn-toggle-senha" id="btn-toggle-login-senha" aria-label="Mostrar senha" aria-controls="login-senha" aria-pressed="false">
                  <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
                </button>
              </div>
            </div>

            <div id="login-erro" class="login-erro" role="alert" aria-live="polite"></div>

            <div class="pt-1 mb-4">
              <button data-mdb-button-init data-mdb-ripple-init class="btn btn-login-destaque btn-lg w-100" type="submit">Login</button>
            </div>

            <p class="small mb-4 pb-lg-2"><a class="text-muted" href="#!">Esqueceu a senha?</a></p>
            <p>Não possui uma conta? <a href="cadastro.html" class="link-info">Cadastre-se aqui</a></p>

          </form>

        </div>

        <div class="px-3 px-xl-4 pb-2">
          <small class="text-muted" style="font-size: 0.78rem;">© 2026 Galea. Todos os direitos reservados.</small>
        </div>

      </div>

      <!-- Imagem do Céu Estrelado à direita -->
      <div class="col-sm-6 px-0 d-none d-sm-block sessao-imagem-estrelas">
        <img src="images/others/wallpaperestrelas1.png"
          alt="Céu estrelado Galea" class="w-100 vh-100" style="object-fit: cover; object-position: left;">
      </div>
    </div>
  </div>
</section>

<script>
    const btnToggle = document.getElementById('btn-toggle-login-senha');
    const inputSenha = document.getElementById('login-senha');
    const inputUsuario = document.getElementById('login-usuario');
    const erroLogin = document.getElementById('login-erro');
    const formLogin = document.getElementById('form-login');
    const icone = btnToggle.querySelector('.material-symbols-outlined');

    btnToggle.addEventListener('click', () => {
        const visivel = inputSenha.type === 'text';
        inputSenha.type = visivel ? 'password' : 'text';
        icone.textContent = visivel ? 'visibility' : 'visibility_off';
        btnToggle.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
        btnToggle.setAttribute('aria-pressed', String(!visivel));
        inputSenha.focus();
    });

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        erroLogin.textContent = '';

        const usuarioVal = inputUsuario.value.trim();
        const senhaVal = inputSenha.value;

        if (!usuarioVal || !senhaVal) {
            erroLogin.textContent = 'Preencha usuário e senha.';
            return;
        }

        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ usuario: usuarioVal, senha: senhaVal })
            });

            const dados = await resp.json().catch(() => ({}));

            if (resp.ok) {
                if (dados.usuario?.nome) {
                    try {
                        localStorage.setItem('galea_nome_perfil', dados.usuario.nome);
                        if (dados.usuario.xp_total !== undefined) {
                            localStorage.setItem('galea_usuario_xp', String(dados.usuario.xp_total));
                        }
                    } catch (e) {}
                }
                window.location.href = 'home.html';
            } else {
                erroLogin.textContent = dados.erro || 'Credenciais inválidas.';
            }
        } catch (redeErr) {
            erroLogin.textContent = 'Servidor fora do ar ou sem conexão. Tente novamente em instantes.';
        }
    });
</script>

</body>
</html>
