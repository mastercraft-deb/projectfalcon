<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galea - O futuro da educação</title>
    <link rel="icon" href="images/logos/logo.png" type="image/png">

    <!-- Preferências (Configurações) valem para o site todo: este arquivo vem cedo, no <head> -->
    <script src="script/preferencias.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="body pagina-home">

    <!-- Menu lateral: fica fixo na tela -->
    <aside class="lateral" id="menu-lateral">
        <div class="lateral-marca">
            <img src="images/logos/logo.png" alt="" width="56" height="56">
            <span class="lateral-nome">Galea</span>
        </div>

        <nav class="menu" aria-label="Menu principal">
            <button class="botoes" data-menu="pesquisar" onclick="alterarLink('pages/search.html')"><span class="material-symbols-outlined" aria-hidden="true">search</span><span class="menu-texto">Descobrir</span></button>
            <button class="botoes" data-menu="cursos" onclick="alterarLink('pages/mycourses.html')"><span class="material-symbols-outlined" aria-hidden="true">library_books</span><span class="menu-texto">Meus cursos</span></button>
            <button class="botoes" data-menu="comunidade" onclick="alterarLink('pages/community.html')"><span class="material-symbols-outlined" aria-hidden="true">language</span><span class="menu-texto">Comunidade</span></button>
            <button class="botoes" data-menu="perfil" onclick="alterarLink('pages/account.html')"><span class="material-symbols-outlined" aria-hidden="true">account_circle</span><span class="menu-texto">Perfil</span></button>
            <button class="botoes" data-menu="config" onclick="alterarLink('pages/settings.html')"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span class="menu-texto">Configurações</span></button>
        </nav>

        <!-- Rodapé do menu: fica no fim da barra lateral -->
        <div class="lateral-rodape">
            <button type="button" class="botoes botao-sair" id="botao-sair" aria-haspopup="dialog">
                <span class="material-symbols-outlined" aria-hidden="true">logout</span><span class="menu-texto">Sair</span>
            </button>
        </div>
    </aside>

    <!-- Botão que recolhe/expande o menu: fica em cima da divisa amarela da barra lateral -->
    <button type="button" class="lateral-alternar" id="menu-alternar"
            aria-controls="menu-lateral" aria-expanded="true" aria-label="Recolher menu lateral">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>

    <!-- Tudo que fica à direita do menu -->
    <div class="conteudo">

        <header class="topo">
            <!-- Espaço para links de atalho (no Figma: "ABCDE" e "EFGHI").
                 Quando decidirem os nomes, é só descomentar:
            <nav class="topo-links" aria-label="Atalhos">
                <a href="...">Nome do link</a>
            </nav>
            -->
            <button type="button" class="sino" aria-label="Notificações">
                <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
            </button>
        </header>

        <main class="area">
            <!-- O id "teste001" é usado pelo script.js (função alterarLink) -->
            <iframe id="teste001" title="Conteúdo da página" src="pages/mycourses.html"></iframe>
        </main>
    </div>

    <!-- Foto de perfil no canto: clicar abre a página de perfil -->
    <button type="button" class="perfil-rapido" id="perfil-rapido" aria-label="Abrir meu perfil">
        <img src="images/boiola.jpg" alt="">
    </button>

    <!-- Confirmação ao clicar em Sair -->
    <dialog class="sair-dialogo" id="sair-dialogo" aria-labelledby="sair-titulo">
        <h2 class="sair-titulo" id="sair-titulo">Sair da conta?</h2>
        <p class="sair-texto">Você vai ser desconectado e voltar para a tela de login.</p>
        <div class="sair-acoes">
            <button type="button" class="sair-botao" id="sair-cancelar">Cancelar</button>
            <button type="button" class="sair-botao perigo" id="sair-confirmar">Sim, sair</button>
        </div>
    </dialog>

    <!-- Lembrete de pausa (Configurações > Foco e pausas) -->
    <div class="aviso-pausa" id="aviso-pausa" role="status" hidden>
        <span class="material-symbols-outlined" aria-hidden="true">self_improvement</span>
        <p id="aviso-pausa-texto"></p>
        <button type="button" class="aviso-pausa-botao" id="aviso-pausa-ok">Ok</button>
    </div>

    <script src="script/script.js"></script>
    <script src="script/home.js"></script>
</body>
</html>
