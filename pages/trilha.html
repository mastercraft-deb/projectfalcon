<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha do curso - Galea</title>
    <link rel="icon" href="../images/logos/logo.png" type="image/png">

    <!-- Preferências (Configurações) valem para o site todo -->
    <script src="../script/preferencias.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/trilha.css">
    <link rel="stylesheet" href="../style/gamificacao.css">

    <!-- Ordem: catálogo/Meus cursos, dados das trilhas, conteúdo pedagógico, gamificação e script da trilha -->
    <script src="../script/cursos.js" defer></script>
    <script src="../script/trilhas.js" defer></script>
    <script src="../script/conteudo-aulas.js" defer></script>
    <script src="../script/gamificacao-engine.js" defer></script>
    <script src="../script/trilha.js" defer></script>
</head>
<body class="body">
    <!-- Qual curso abrir vem do endereço: trilha.html?curso=python (sem isso, abre Física) -->
    <div class="trilha-layout" id="trilha-layout">

        <main class="trilha-pagina">

            <!-- Faixa fixa no topo: mostra onde você está, mesmo rolando o mapa -->
            <header class="trilha-topo">
                <!-- target="_top": a página do curso ocupa a janela inteira, fora do iframe -->
                <a class="trilha-voltar" id="trilha-voltar" href="courses/fisica.html" target="_top">
                    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                    Sobre o curso
                </a>

                <div class="trilha-titulo">
                    <h1 id="trilha-curso">Física – 2026</h1>
                    <p><span id="trilha-concluidos">0</span> de <span id="trilha-total">0</span> aulas concluídas</p>
                </div>

                <!-- A largura do preenchimento vem da variável --progresso -->
                <div class="trilha-barra" id="trilha-barra" role="progressbar" aria-label="Progresso no curso"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--progresso: 0%;">
                    <span class="trilha-barra-preenchimento"></span>
                </div>
            </header>

            <!--
                O mapa. Cada <li> é uma aula e é criado pelo script/trilha.js a partir de
                script/trilhas.js (uma aula = um círculo). Cada <li> tem UM destes estados (classe):
                  modulo-concluido  -> já terminada   (verde, ícone de check)
                  modulo-atual      -> a próxima aula (cor do curso, com o cartão de título)
                  modulo-bloqueado  -> ainda não liberada (cor escura do curso, cadeado)
                A posição em zigue-zague e as linhas de ligação são feitas só pelo CSS
                (por ordem do <li>), então basta incluir ou remover itens da lista.
                Quantas aulas já estão concluídas vem do progresso do curso em "Meus cursos".
            -->
            <ol class="trilha" id="trilha" aria-label="Aulas do curso"></ol>
        </main>

        <!-- Lado direito: entrada direta para o chat deste curso e atalho para o Code Lab -->
        <aside class="trilha-chat" aria-labelledby="trilha-chat-titulo">
            <span class="trilha-chat-icone" aria-hidden="true">
                <span class="material-symbols-outlined">forum</span>
            </span>
            <div class="trilha-chat-corpo">
                <h2 id="trilha-chat-titulo">Chat do curso</h2>
                <p id="trilha-chat-texto"></p>
                <button type="button" class="trilha-chat-botao" id="trilha-chat-botao"></button>
            </div>

            <!-- Atalho interativo para testar códigos no Galea Code -->
            <div class="trilha-codelab-card" id="trilha-codelab-card" style="margin-top: 1.2rem; padding: 1rem; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; text-align: center;">
                <span class="material-symbols-outlined" style="font-size: 28px; color: #38bdf8;">terminal</span>
                <h3 style="font-size: 0.95rem; margin: 0.4rem 0 0.2rem 0; color: #fff;">Galea Code</h3>
                <p style="font-size: 0.78rem; color: rgba(255,255,255,0.7); margin-bottom: 0.8rem;">Pratique seus códigos em tempo real em um mini editor interativo!</p>
                <a href="playground.html" target="_self" class="btn-codelab-abrir" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: #38bdf8; color: #0b0217; text-decoration: none; border-radius: 999px; font-size: 0.82rem; font-weight: 700;">
                    <span class="material-symbols-outlined" style="font-size: 16px;">code</span>
                    Abrir Galea Code
                </a>
            </div>
        </aside>
    </div>

    <!-- Janela de execução de aula (Player de lição) -->
    <dialog class="licao-dialogo" id="licao-dialogo" aria-labelledby="licao-titulo">
        <header class="licao-topo">
            <div class="licao-meta">
                <span class="licao-curso-tag" id="licao-curso-tag">Curso</span>
                <span class="licao-numero-tag" id="licao-numero-tag">Aula 1</span>
            </div>
            <button type="button" class="licao-fechar" id="licao-fechar" aria-label="Fechar lição">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </header>

        <h2 class="licao-titulo" id="licao-titulo">Título da aula</h2>

        <div class="licao-conteudo" id="licao-conteudo" tabindex="0" role="region" aria-label="Conteúdo da aula">
            <!-- Conteúdo textual e pedagógico inserido de forma segura via DOM -->
        </div>

        <footer class="licao-rodape">
            <div class="licao-recompensa">
                <span class="material-symbols-outlined" aria-hidden="true">stars</span>
                <span id="licao-xp-texto">+10 XP</span>
            </div>
            <div class="licao-acoes">
                <button type="button" class="licao-botao-concluir" id="licao-concluir">
                    <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>
                    <span id="licao-concluir-texto">Concluir aula</span>
                </button>
            </div>
        </footer>
    </dialog>

    <p class="sr-only" id="trilha-aviso" aria-live="polite"></p>
</body>
</html>
