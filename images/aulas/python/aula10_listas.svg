<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Listas em Python: O Gaveteiro Mutável</text>

  <!-- Gaveteiro de lista -->
  <g transform="translate(70, 50)">
    <!-- Gaveta 0 -->
    <rect x="0" y="20" width="125" height="60" rx="8" fill="#118AB2" stroke="#FFF" stroke-width="1.5"/>
    <text x="62" y="14" fill="#5CE1E6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">[0]</text>
    <text x="62" y="55" fill="#FFF" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">"maçã"</text>

    <!-- Gaveta 1 -->
    <rect x="140" y="20" width="125" height="60" rx="8" fill="#06D6A0" stroke="#FFF" stroke-width="1.5"/>
    <text x="202" y="14" fill="#5CE1E6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">[1]</text>
    <text x="202" y="55" fill="#17062e" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">"banana"</text>

    <!-- Gaveta 2 -->
    <rect x="280" y="20" width="125" height="60" rx="8" fill="#FFD166" stroke="#FFF" stroke-width="1.5"/>
    <text x="342" y="14" fill="#5CE1E6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">[2]</text>
    <text x="342" y="55" fill="#17062e" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">"uva"</text>

    <!-- Nova Gaveta (.append) -->
    <rect x="420" y="20" width="135" height="60" rx="8" fill="rgba(239, 71, 111, 0.2)" stroke="#EF476F" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="487" y="14" fill="#EF476F" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">.append("laranja")</text>
    <text x="487" y="55" fill="#FF8589" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">+ "laranja"</text>
  </g>

  <!-- Painel de comandos úteis -->
  <g transform="translate(60, 145)">
    <rect width="580" height="52" rx="8" fill="rgba(255,255,255,0.06)"/>
    <text x="25" y="24" fill="#FFF" font-family="monospace" font-size="12">
      frutas = ["maçã", "banana", "uva"]
    </text>
    <text x="25" y="42" fill="#5CE1E6" font-family="monospace" font-size="12">
      frutas.append("laranja") ➔ Adiciona ao final  |  frutas.pop() ➔ Remove o último
    </text>
    <text x="500" y="32" fill="#FFD166" font-family="monospace" font-size="11" font-weight="bold">len(frutas) == 4</text>
  </g>

  <text x="350" y="224" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    💡 As listas usam colchetes [ ] e são MUTÁVEIS: você pode alterar, adicionar ou remover elementos quando quiser!
  </text>
</svg>
