<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galea - O futuro da educação</title>

    <link rel="shortcut icon" href="images/logos/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="body pagina-home">

    <!-- Menu lateral: fica fixo na tela -->
    <aside class="lateral">
        <div class="lateral-marca">
            <img src="images/logos/logo.png" alt="" width="56" height="56">
            <span class="lateral-nome">Galea</span>
        </div>

        <nav class="menu" aria-label="Menu principal">
            <button class="botoes" data-menu="pesquisar" onclick="alterarLink('pages/search.html')"><span class="material-symbols-outlined" aria-hidden="true">search</span><span class="menu-texto">Descobrir</span></button>
            <button class="botoes" data-menu="cursos" onclick="alterarLink('pages/mycourses.html')"><span class="material-symbols-outlined" aria-hidden="true">library_books</span><span class="menu-texto">Meus cursos</span></button>
            <button class="botoes" data-menu="turmas" onclick="alterarLink('pages/classes.html')"><span class="material-symbols-outlined" aria-hidden="true">school</span><span class="menu-texto">Turmas</span></button>
            <button class="botoes" data-menu="comunidade" onclick="alterarLink('pages/community.html')"><span class="material-symbols-outlined" aria-hidden="true">language</span><span class="menu-texto">Comunidade</span></button>
            <button class="botoes" data-menu="perfil" onclick="alterarLink('pages/account.html')"><span class="material-symbols-outlined" aria-hidden="true">account_circle</span><span class="menu-texto">Perfil</span></button>
            <button class="botoes" data-menu="config" onclick="alterarLink('pages/settings.html')"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span class="menu-texto">Configurações</span></button>
        </nav>
    </aside>

    <!-- Tudo que fica à direita do menu -->
    <div class="conteudo">

        <header class="topo">
            <!-- Espaço para links de atalho (no Figma: "ABCDE" e "EFGHI").
                 Quando decidirem os nomes, é só descomentar:
            <nav class="topo-links" aria-label="Atalhos">
                <a href="...">Nome do link</a>
            </nav>
            -->
            <button type="button" class="sino" aria-label="Notificações">
                <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
            </button>
        </header>

        <main class="area">
            <!-- O id "teste001" é usado pelo script.js (função alterarLink) -->
            <iframe id="teste001" title="Conteúdo da página" src="pages/mycourses.html"></iframe>
        </main>
    </div>

    <!-- Foto de perfil no canto: clicar abre a página de perfil -->
    <button type="button" class="perfil-rapido" id="perfil-rapido" aria-label="Abrir meu perfil">
        <img src="images/boiola.jpg" alt="">
    </button>

    <script src="script/script.js"></script>
    <script>
        (() => {
            // Páginas que a home abre direto pelo endereço (home.html#perfil, home.html#trilha).
            // "menu" é o item do menu lateral que fica marcado quando a página abre.
            const rotas = {
                perfil: { url: 'pages/account.html', menu: 'perfil' },
                trilha: { url: 'pages/trilha.html',  menu: 'cursos' }
            };
            const menu = document.querySelector('.menu');

            function marcarMenu(nome) {
                menu.querySelectorAll('.botoes').forEach(botao => {
                    const ativo = botao.dataset.menu === nome;
                    botao.classList.toggle('ativo', ativo);
                    if (ativo) botao.setAttribute('aria-current', 'page');
                    else botao.removeAttribute('aria-current');
                });
            }

            // clicar num item do menu marca esse item
            menu.addEventListener('click', evento => {
                const botao = evento.target.closest('.botoes');
                if (botao) marcarMenu(botao.dataset.menu);
            });

            // a foto de perfil no canto abre o perfil e marca "Perfil" no menu
            document.getElementById('perfil-rapido').addEventListener('click', () => {
                alterarLink('pages/account.html');
                marcarMenu('perfil');
            });

            // Quando a foto do perfil é ampliada (dentro do iframe), esconde a foto pequena
            // do canto para ela não aparecer duas vezes. A página do iframe avisa por mensagem.
            const fotoCanto = document.getElementById('perfil-rapido');
            const quadro = document.getElementById('teste001');

            const imagemCanto = fotoCanto.querySelector('img');

            window.addEventListener('message', evento => {
                if (evento.source !== quadro.contentWindow) return; // só aceita mensagem do iframe
                const dados = evento.data;
                if (!dados) return;

                // esconde/mostra a foto do canto (enquanto há uma janela de foto aberta)
                if (dados.tipo === 'foto-canto') {
                    fotoCanto.hidden = Boolean(dados.escondida);
                }
                // o perfil trocou a foto: atualiza a do canto também
                if (dados.tipo === 'foto-perfil' && typeof dados.src === 'string'
                        && dados.src.startsWith('data:image/')) {
                    imagemCanto.src = dados.src;
                }
            });

            // ao abrir a home, usa a foto que o usuário já tinha escolhido (se houver)
            try {
                const fotoSalva = localStorage.getItem('galea_foto_perfil');
                if (fotoSalva && fotoSalva.startsWith('data:image/')) imagemCanto.src = fotoSalva;
            } catch (e) { /* sem armazenamento: mantém a foto padrão */ }

            // trocou de página dentro do iframe: a foto do canto volta ao normal
            quadro.addEventListener('load', () => { fotoCanto.hidden = false; });

            // ao abrir: a página pedida no endereço ou, por padrão, "Meus cursos"
            const rota = rotas[location.hash.slice(1)];
            if (rota) alterarLink(rota.url);
            marcarMenu(rota ? rota.menu : 'cursos');
        })();
    </script>
</body>
</html>
