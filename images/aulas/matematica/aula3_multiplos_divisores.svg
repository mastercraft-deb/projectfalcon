<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Múltiplos e Divisores: O número 12 em Foco</text>

  <!-- Seção Múltiplos (Saltos de 3 em 3) -->
  <g transform="translate(40, 50)">
    <rect width="290" height="135" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="#A98BFF" stroke-width="1.5"/>
    <text x="145" y="25" fill="#C4B0FF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Múltiplos de 3 (Saltos de 3)</text>
    
    <!-- Linha com passos -->
    <path d="M 25 75 Q 55 45 85 75" fill="none" stroke="#FFD166" stroke-width="2.5"/>
    <path d="M 85 75 Q 115 45 145 75" fill="none" stroke="#FFD166" stroke-width="2.5"/>
    <path d="M 145 75 Q 175 45 205 75" fill="none" stroke="#FFD166" stroke-width="2.5"/>
    <path d="M 205 75 Q 235 45 265 75" fill="none" stroke="#FFD166" stroke-width="2.5"/>

    <circle cx="25" cy="75" r="4" fill="#FFFFFF"/>
    <text x="25" y="98" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">0</text>
    
    <circle cx="85" cy="75" r="4" fill="#FFFFFF"/>
    <text x="85" y="98" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    
    <circle cx="145" cy="75" r="4" fill="#FFFFFF"/>
    <text x="145" y="98" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">6</text>
    
    <circle cx="205" cy="75" r="4" fill="#FFFFFF"/>
    <text x="205" y="98" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">9</text>
    
    <circle cx="265" cy="75" r="5" fill="#06D6A0"/>
    <text x="265" y="98" fill="#06D6A0" font-size="13" font-weight="bold" text-anchor="middle">12</text>

    <text x="145" y="122" fill="rgba(255,255,255,0.7)" font-size="11" text-anchor="middle">12 é múltiplo de 3 (3 × 4 = 12)</text>
  </g>

  <!-- Seção Divisores (Divisão exata sem resto) -->
  <g transform="translate(370, 50)">
    <rect width="290" height="135" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="#06D6A0" stroke-width="1.5"/>
    <text x="145" y="25" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Divisores de 12 (Grupos Perfeitos)</text>
    
    <!-- 12 blocos em 3 grupos de 4 -->
    <g transform="translate(35, 45)">
      <!-- Grupo 1 -->
      <rect x="0" y="0" width="60" height="35" rx="4" fill="rgba(6, 214, 160, 0.2)" stroke="#06D6A0" stroke-width="1.5"/>
      <text x="30" y="22" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">4 itens</text>

      <!-- Grupo 2 -->
      <rect x="80" y="0" width="60" height="35" rx="4" fill="rgba(6, 214, 160, 0.2)" stroke="#06D6A0" stroke-width="1.5"/>
      <text x="110" y="22" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">4 itens</text>

      <!-- Grupo 3 -->
      <rect x="160" y="0" width="60" height="35" rx="4" fill="rgba(6, 214, 160, 0.2)" stroke="#06D6A0" stroke-width="1.5"/>
      <text x="190" y="22" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">4 itens</text>
    </g>

    <text x="145" y="105" fill="#FFD166" font-size="13" font-weight="bold" text-anchor="middle">12 ÷ 3 = 4 (Resto = 0!)</text>
    <text x="145" y="122" fill="rgba(255,255,255,0.7)" font-size="11" text-anchor="middle">Divisores: 1, 2, 3, 4, 6 e 12</text>
  </g>

  <text x="350" y="215" fill="rgba(255,255,255,0.75)" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">🧠 Múltiplos crescem infinitamente. Divisores dividem sem sobrar migalhas!</text>
</svg>
