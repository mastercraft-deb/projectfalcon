<!DOCTYPE html>
<html lang="pt-br">
<head>

<body class="body">

    <script>
        // Permite abrir a home já numa página, por exemplo: home.html#perfil
        const rotasIniciais = { perfil: 'pages/account.html' };
        const rotaInicial = rotasIniciais[location.hash.slice(1)];
        if (rotaInicial) alterarLink(rotaInicial);
    </script>
