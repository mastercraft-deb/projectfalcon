<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Dicionários: Pares Chave ➔ Valor { key: value }</text>

  <!-- Crachá com dados de dicionário -->
  <g transform="translate(100, 50)">
    <rect width="500" height="120" rx="10" fill="rgba(255,255,255,0.05)" stroke="#A98BFF" stroke-width="1.5"/>
    
    <!-- Linha 1: nome -->
    <rect x="30" y="20" width="120" height="36" rx="6" fill="#A98BFF"/>
    <text x="90" y="43" fill="#17062e" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">"nome"</text>
    <text x="175" y="44" fill="#FFF" font-family="monospace" font-size="20" font-weight="bold">:</text>
    <rect x="205" y="20" width="180" height="36" rx="6" fill="rgba(6, 214, 160, 0.2)" stroke="#06D6A0"/>
    <text x="295" y="43" fill="#5CE1E6" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">"Ana Silva"</text>

    <!-- Linha 2: idade -->
    <rect x="30" y="66" width="120" height="36" rx="6" fill="#A98BFF"/>
    <text x="90" y="89" fill="#17062e" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">"xp"</text>
    <text x="175" y="90" fill="#FFF" font-family="monospace" font-size="20" font-weight="bold">:</text>
    <rect x="205" y="66" width="180" height="36" rx="6" fill="rgba(255, 209, 102, 0.2)" stroke="#FFD166"/>
    <text x="295" y="89" fill="#FFD166" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">1250</text>

    <!-- Como acessar -->
    <rect x="405" y="20" width="75" height="82" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="442" y="45" fill="#FFF" font-size="10" text-anchor="middle">Acessar:</text>
    <text x="442" y="65" fill="#5CE1E6" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">aluno["xp"]</text>
    <text x="442" y="85" fill="#FFD166" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1250</text>
  </g>

  <text x="350" y="210" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    Em vez de índices 0, 1, 2, você busca pela CHAVE ("nome", "email", "pontos"). É super rápido e legível!
  </text>
</svg>
