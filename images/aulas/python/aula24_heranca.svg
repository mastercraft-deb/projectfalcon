<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Programação Orientada a Objetos: Herança</text>

  <g transform="translate(150, 45)">
    <!-- Classe Pai -->
    <rect x="110" y="0" width="180" height="55" rx="8" fill="#118AB2" stroke="#FFF" stroke-width="1.5"/>
    <text x="200" y="24" fill="#FFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">class Animal:</text>
    <text x="200" y="44" fill="#5CE1E6" font-size="11" text-anchor="middle">dormir(), comer()</text>

    <!-- Setas de Herança -->
    <path d="M 160 55 L 70 85" stroke="#FFD166" stroke-width="2"/>
    <polygon points="65,87 73,78 78,87" fill="#FFD166"/>

    <path d="M 240 55 L 330 85" stroke="#FFD166" stroke-width="2"/>
    <polygon points="335,87 322,87 327,78" fill="#FFD166"/>

    <!-- Classe Filha 1 -->
    <rect x="0" y="90" width="170" height="65" rx="8" fill="rgba(6, 214, 160, 0.15)" stroke="#06D6A0" stroke-width="1.5"/>
    <text x="85" y="112" fill="#5CE1E6" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">class Cachorro(Animal):</text>
    <text x="85" y="132" fill="#FFF" font-size="11" text-anchor="middle">latir() + herda tudo!</text>

    <!-- Classe Filha 2 -->
    <rect x="230" y="90" width="170" height="65" rx="8" fill="rgba(255, 209, 102, 0.15)" stroke="#FFD166" stroke-width="1.5"/>
    <text x="315" y="112" fill="#FFD166" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">class Gato(Animal):</text>
    <text x="315" y="132" fill="#FFF" font-size="11" text-anchor="middle">miar() + herda tudo!</text>
  </g>

  <text x="350" y="215" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    💡 Economia de código: tudo o que a classe Pai já sabe fazer não precisa ser reescrito nas classes Filhas!
  </text>
</svg>
