<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Mini Projeto: Fluxo do Jogo de Adivinhação</text>

  <!-- Passos do Jogo -->
  <g transform="translate(40, 55)">
    <!-- 1. Computador sorteia -->
    <rect x="0" y="0" width="135" height="110" rx="8" fill="rgba(255,255,255,0.05)" stroke="#118AB2" stroke-width="1.5"/>
    <text x="67" y="24" fill="#5CE1E6" font-size="12" font-weight="bold" text-anchor="middle">1. Sorteio</text>
    <text x="67" y="55" fill="#FFF" font-family="monospace" font-size="11" text-anchor="middle">secreto =</text>
    <text x="67" y="75" fill="#FFD166" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">randint(1, 100)</text>

    <!-- Seta -->
    <path d="M 140 55 L 160 55" stroke="#FFF" stroke-width="2"/>

    <!-- 2. Jogador chuta -->
    <rect x="165" y="0" width="135" height="110" rx="8" fill="rgba(255,255,255,0.05)" stroke="#FFD166" stroke-width="1.5"/>
    <text x="232" y="24" fill="#FFD166" font-size="12" font-weight="bold" text-anchor="middle">2. Chute</text>
    <text x="232" y="55" fill="#FFF" font-family="monospace" font-size="11" text-anchor="middle">chute =</text>
    <text x="232" y="75" fill="#5CE1E6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">int(input())</text>

    <!-- Seta -->
    <path d="M 305 55 L 325 55" stroke="#FFF" stroke-width="2"/>

    <!-- 3. Comparação com while e if -->
    <rect x="330" y="0" width="145" height="110" rx="8" fill="rgba(255,255,255,0.05)" stroke="#EF476F" stroke-width="1.5"/>
    <text x="402" y="24" fill="#FF8589" font-size="12" font-weight="bold" text-anchor="middle">3. Dicas</text>
    <text x="402" y="52" fill="#FFF" font-size="10" text-anchor="middle">chute &gt; secreto: "Menor!"</text>
    <text x="402" y="72" fill="#FFF" font-size="10" text-anchor="middle">chute &lt; secreto: "Maior!"</text>
    <text x="402" y="94" fill="#FFD166" font-size="10" font-weight="bold" text-anchor="middle">Laço while continua</text>

    <!-- Seta -->
    <path d="M 480 55 L 500 55" stroke="#FFF" stroke-width="2"/>

    <!-- 4. Vitória -->
    <rect x="505" y="0" width="115" height="110" rx="8" fill="rgba(6, 214, 160, 0.2)" stroke="#06D6A0" stroke-width="1.8"/>
    <text x="562" y="24" fill="#06D6A0" font-size="12" font-weight="bold" text-anchor="middle">4. Vitória! 🎉</text>
    <text x="562" y="55" fill="#FFF" font-size="11" text-anchor="middle">chute == secreto</text>
    <text x="562" y="80" fill="#FFD166" font-size="14" font-weight="900" text-anchor="middle">+50 XP!</text>
  </g>

  <text x="350" y="200" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    Combina: variáveis, biblioteca random, laço while, conversão int(), estruturas if/elif e contagem de tentativas!
  </text>
</svg>
