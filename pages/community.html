<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade - Galea</title>
    <link rel="icon" href="../images/logos/logo.png" type="image/png">

    <!-- Preferências (Configurações) valem para o site todo -->
    <script src="../script/preferencias.js"></script>

    <!-- Os ícones precisam ser carregados aqui também: o iframe é um documento separado da home.html -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/comunidade.css">

    <!-- cursos.js (lista "Meus cursos") precisa vir antes do comunidade.js -->
    <script src="../script/cursos.js" defer></script>
    <script src="../script/comunidade.js" defer></script>
</head>
<body>
    <main class="comunidade">

        <!-- Troca de chat: "Geral" + um chat por curso de Meus cursos (montado pelo script/comunidade.js) -->
        <div class="chats" id="chats" role="tablist" aria-label="Chats da comunidade"></div>
        <p class="chat-descricao" id="chat-descricao"></p>

        <!-- As mensagens do chat escolhido -->
        <div class="painel" id="painel" role="tabpanel">
            <ol class="mensagens" id="mensagens" aria-label="Mensagens do chat"></ol>
        </div>

        <!-- Caixa para escrever. A faixa "Respondendo a..." só aparece ao clicar em Responder -->
        <form class="compositor" id="compositor">
            <div class="compositor-resposta" id="compositor-resposta" hidden>
                <span class="material-symbols-outlined" aria-hidden="true">reply</span>
                <span class="compositor-resposta-texto">
                    Respondendo a <strong id="resposta-nome"></strong>:
                    <span id="resposta-resumo"></span>
                </span>
                <button type="button" class="acao-icone" id="resposta-cancelar" aria-label="Cancelar resposta">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
            </div>

            <div class="compositor-linha">
                <img class="avatar" id="compositor-avatar" src="../images/avatar-default.webp" alt="">
                <label class="sr-only" for="texto">Sua mensagem</label>
                <textarea id="texto" rows="1" maxlength="500"
                          placeholder="Escreva uma mensagem… (Enter envia, Shift+Enter quebra a linha)"></textarea>
                <button type="submit" class="enviar" aria-label="Enviar mensagem">
                    <span class="material-symbols-outlined" aria-hidden="true">send</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Aviso invisível para leitores de tela -->
    <p class="sr-only" id="aviso" aria-live="polite"></p>
</body>
</html>
