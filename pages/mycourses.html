<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus cursos - Galea</title>
    <link rel="icon" href="../images/logos/logo.png" type="image/png">

    <!-- Preferências (Configurações) valem para o site todo -->
    <script src="../script/preferencias.js"></script>

    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/mycourses.css">
    <script src="../script/cursos.js" defer></script>
    <script src="../script/mycourses.js" defer></script>
</head>
<body class="pagina-cursos">

    <main class="carrossel" aria-label="Meus cursos">

        <!--
            Cada <li> é um curso e é criado pelo script/mycourses.js a partir da lista
            "Meus cursos" (script/cursos.js). O data-slot diz ONDE ele está agora:
              0 = grande (selecionado)   1, 2, 3 = menores à direita
              4 = esperando escondido    -1 = já passou (sumiu à esquerda)
            O script troca esses números ao clicar nas setas; o CSS faz a animação.
            Para adicionar cursos aqui, use a página Descobrir.
        -->
        <ul class="carrossel-lista"></ul>

        <div class="carrossel-vazio" id="carrossel-vazio" hidden>
            <p>Você ainda não tem cursos por aqui.</p>
            <p>Abra <strong>Descobrir</strong> no menu para encontrar e adicionar o seu primeiro.</p>
        </div>

        <button type="button" class="seta seta-ant" aria-label="Curso anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="seta seta-prox" aria-label="Próximo curso">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>

        <!-- Avisa leitores de tela qual curso está selecionado -->
        <p class="sr-only" id="carrossel-aviso" aria-live="polite"></p>
    </main>

</body>
</html>
