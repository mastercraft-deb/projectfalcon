<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="100%" height="100%">
  <defs>
    <linearGradient id="gradNeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A5F" />
      <stop offset="100%" stop-color="#FF7A5C" />
    </linearGradient>
    <linearGradient id="gradPos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#2EC4B6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="#17062e" />

  <!-- Título do gráfico -->
  <text x="350" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">A Reta Numérica: Inteiros (ℤ) e Naturais (ℕ)</text>

  <!-- Etiquetas de zonas -->
  <rect x="50" y="52" width="260" height="28" rx="6" fill="rgba(255, 90, 95, 0.15)" stroke="#FF5A5F" stroke-width="1"/>
  <text x="180" y="71" fill="#FF8589" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">NEGATIVOS: Dívidas, abaixo de zero</text>

  <rect x="390" y="52" width="260" height="28" rx="6" fill="rgba(46, 196, 182, 0.15)" stroke="#2EC4B6" stroke-width="1"/>
  <text x="520" y="71" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">NATURAIS (ℕ): Contagem, ganhos</text>

  <!-- Linha Central da Reta -->
  <!-- Setas nas pontas -->
  <path d="M 40 130 L 660 130" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <polygon points="35,130 48,123 48,137" fill="#FFFFFF"/>
  <polygon points="665,130 652,123 652,137" fill="#FFFFFF"/>

  <!-- Marcadores e números (-4 a +4) -->
  <!-- -4 -->
  <line x1="110" y1="120" x2="110" y2="140" stroke="#FF5A5F" stroke-width="3"/>
  <circle cx="110" cy="130" r="5" fill="#FF5A5F"/>
  <text x="110" y="165" fill="#FF8589" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">-4</text>

  <!-- -3 -->
  <line x1="170" y1="120" x2="170" y2="140" stroke="#FF5A5F" stroke-width="3"/>
  <circle cx="170" cy="130" r="5" fill="#FF5A5F"/>
  <text x="170" y="165" fill="#FF8589" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">-3</text>

  <!-- -2 -->
  <line x1="230" y1="120" x2="230" y2="140" stroke="#FF5A5F" stroke-width="3"/>
  <circle cx="230" cy="130" r="5" fill="#FF5A5F"/>
  <text x="230" y="165" fill="#FF8589" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">-2</text>

  <!-- -1 -->
  <line x1="290" y1="120" x2="290" y2="140" stroke="#FF5A5F" stroke-width="3"/>
  <circle cx="290" cy="130" r="5" fill="#FF5A5F"/>
  <text x="290" y="165" fill="#FF8589" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">-1</text>

  <!-- 0 (Origem) -->
  <line x1="350" y1="112" x2="350" y2="148" stroke="#FFD166" stroke-width="4"/>
  <circle cx="350" cy="130" r="8" fill="#FFD166" stroke="#17062e" stroke-width="2"/>
  <text x="350" y="170" fill="#FFD166" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">0</text>
  <text x="350" y="105" fill="#FFD166" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ORIGEM</text>

  <!-- +1 -->
  <line x1="410" y1="120" x2="410" y2="140" stroke="#2EC4B6" stroke-width="3"/>
  <circle cx="410" cy="130" r="5" fill="#2EC4B6"/>
  <text x="410" y="165" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">+1</text>

  <!-- +2 -->
  <line x1="470" y1="120" x2="470" y2="140" stroke="#2EC4B6" stroke-width="3"/>
  <circle cx="470" cy="130" r="5" fill="#2EC4B6"/>
  <text x="470" y="165" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">+2</text>

  <!-- +3 -->
  <line x1="530" y1="120" x2="530" y2="140" stroke="#2EC4B6" stroke-width="3"/>
  <circle cx="530" cy="130" r="5" fill="#2EC4B6"/>
  <text x="530" y="165" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">+3</text>

  <!-- +4 -->
  <line x1="590" y1="120" x2="590" y2="140" stroke="#2EC4B6" stroke-width="3"/>
  <circle cx="590" cy="130" r="5" fill="#2EC4B6"/>
  <text x="590" y="165" fill="#5CE1E6" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">+4</text>

  <!-- Dica de leitura rápida -->
  <text x="350" y="200" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">💡 Andar para a direita = Somar | Andar para a esquerda = Subtrair</text>
</svg>
