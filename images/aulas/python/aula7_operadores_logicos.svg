<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  <text x="350" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Operadores Lógicos: AND, OR e NOT</text>

  <g transform="translate(40, 50)">
    <!-- Operador AND -->
    <rect x="0" y="0" width="195" height="130" rx="10" fill="rgba(255,255,255,0.05)" stroke="#06D6A0" stroke-width="1.5"/>
    <text x="97" y="25" fill="#5CE1E6" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">and (E)</text>
    <text x="97" y="44" fill="rgba(255,255,255,0.7)" font-size="11" text-anchor="middle">Exige TUDO verdadeiro</text>
    
    <rect x="15" y="55" width="165" height="60" rx="6" fill="rgba(6, 214, 160, 0.15)"/>
    <text x="25" y="75" fill="#FFF" font-family="monospace" font-size="11">True and True  ➔ <tspan fill="#06D6A0" font-weight="bold">True</tspan></text>
    <text x="25" y="93" fill="#FFF" font-family="monospace" font-size="11">True and False ➔ <tspan fill="#EF476F" font-weight="bold">False</tspan></text>
    <text x="97" y="125" fill="#FFD166" font-size="10" text-anchor="middle">Como senha E usuário corretos</text>

    <!-- Operador OR -->
    <rect x="215" y="0" width="195" height="130" rx="10" fill="rgba(255,255,255,0.05)" stroke="#FFD166" stroke-width="1.5"/>
    <text x="312" y="25" fill="#FFD166" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">or (OU)</text>
    <text x="312" y="44" fill="rgba(255,255,255,0.7)" font-size="11" text-anchor="middle">Basta UM ser verdadeiro</text>
    
    <rect x="230" y="55" width="165" height="60" rx="6" fill="rgba(255, 209, 102, 0.15)"/>
    <text x="240" y="75" fill="#FFF" font-family="monospace" font-size="11">True or False  ➔ <tspan fill="#06D6A0" font-weight="bold">True</tspan></text>
    <text x="240" y="93" fill="#FFF" font-family="monospace" font-size="11">False or False ➔ <tspan fill="#EF476F" font-weight="bold">False</tspan></text>
    <text x="312" y="125" fill="#5CE1E6" font-size="10" text-anchor="middle">Como pagar com Pix OU Cartão</text>

    <!-- Operador NOT -->
    <rect x="430" y="0" width="190" height="130" rx="10" fill="rgba(255,255,255,0.05)" stroke="#EF476F" stroke-width="1.5"/>
    <text x="525" y="25" fill="#FF8589" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">not (NÃO)</text>
    <text x="525" y="44" fill="rgba(255,255,255,0.7)" font-size="11" text-anchor="middle">Inverte o valor booleano</text>
    
    <rect x="445" y="55" width="160" height="60" rx="6" fill="rgba(239, 71, 111, 0.15)"/>
    <text x="455" y="75" fill="#FFF" font-family="monospace" font-size="11">not True  ➔ <tspan fill="#EF476F" font-weight="bold">False</tspan></text>
    <text x="455" y="93" fill="#FFF" font-family="monospace" font-size="11">not False ➔ <tspan fill="#06D6A0" font-weight="bold">True</tspan></text>
    <text x="525" y="125" fill="#FF8589" font-size="10" text-anchor="middle">Como um interruptor liga/desliga</text>
  </g>

  <text x="350" y="215" fill="rgba(255,255,255,0.75)" font-size="11" text-anchor="middle">
    Exemplo prático: <tspan fill="#5CE1E6">if idade &gt;= 18 and tem_cnh: print("Pode dirigir!")</tspan>
  </text>
</svg>
