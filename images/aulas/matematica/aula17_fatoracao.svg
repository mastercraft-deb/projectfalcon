<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="100%" height="100%" rx="16" fill="#17062e" />
  
  <text x="350" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Fatoração: O Caminho Inverso da Multiplicação</text>

  <!-- Comparação Ida e Volta -->
  <g transform="translate(60, 55)">
    <!-- Bloco 1: Forma Expandida (Soma) -->
    <rect x="0" y="0" width="230" height="90" rx="8" fill="rgba(239, 71, 111, 0.15)" stroke="#EF476F" stroke-width="1.5"/>
    <text x="115" y="28" fill="#FF8589" font-size="13" font-weight="bold" text-anchor="middle">Forma Expandida (Soma)</text>
    <text x="115" y="65" fill="#FFF" font-size="22" font-weight="900" text-anchor="middle">
      <tspan fill="#FFD166">3</tspan>x + <tspan fill="#FFD166">6</tspan>
    </text>
    <text x="115" y="80" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">(6 é igual a 3 × 2!)</text>

    <!-- Setas de Ida e Volta -->
    <g transform="translate(250, 15)">
      <!-- Fatorar (Ida) -->
      <path d="M 10 15 L 70 15" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#setaVerde)"/>
      <polygon points="75,15 65,10 65,20" fill="#06D6A0"/>
      <text x="40" y="8" fill="#06D6A0" font-size="11" font-weight="bold" text-anchor="middle">Fatorar</text>

      <!-- Distribuir (Volta) -->
      <polygon points="5,45 15,40 15,50" fill="#EF476F"/>
      <path d="M 10 45 L 70 45" stroke="#EF476F" stroke-width="2.5"/>
      <text x="40" y="58" fill="#EF476F" font-size="11" font-weight="bold" text-anchor="middle">Distribuir</text>
    </g>

    <!-- Bloco 2: Forma Fatorada (Produto) -->
    <rect x="350" y="0" width="230" height="90" rx="8" fill="rgba(6, 214, 160, 0.15)" stroke="#06D6A0" stroke-width="1.5"/>
    <text x="465" y="28" fill="#5CE1E6" font-size="13" font-weight="bold" text-anchor="middle">Forma Fatorada (Produto)</text>
    <text x="465" y="65" fill="#FFF" font-size="22" font-weight="900" text-anchor="middle">
      <tspan fill="#FFD166">3</tspan>(x + 2)
    </text>
    <text x="465" y="80" fill="#FFD166" font-size="10" text-anchor="middle">3 é o fator comum colocado em evidência</text>
  </g>

  <!-- Exemplos chave -->
  <g transform="translate(60, 165)">
    <rect width="580" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="290" y="24" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">
      Outro caso de ouro: <tspan fill="#FFD166">Diferença de Dois Quadrados</tspan>
    </text>
    <text x="290" y="42" fill="#5CE1E6" font-size="14" font-weight="800" text-anchor="middle">
      a² − b² = (a + b) × (a − b)   |   Exemplo: x² − 9 = (x + 3)(x − 3)
    </text>
  </g>
</svg>
